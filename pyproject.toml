[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gesher"
description = "A secure, pure-Python HTTP tunnel to expose local services to the internet."
version = "1.0.0"
authors = [
    {name = "Yaron Koresh"},
]
requires-python = ">=3.8,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
license = {text = "GPL-3.0"}
license-files = ["LICENSE"]
keywords = ["repository", "tunneling", "networking"]
dependencies = [
    "requests",
    "cryptography"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "poethepoet",
    "pre-commit",
    "build",
    "mypy",
    "vulture"
]

[project.scripts]
gesher = "gesher.cli:main"

[project.urls]
Homepage = "https://github.com/YaronKoresh/gesher"
Repository = "https://github.com/YaronKoresh/gesher"
Issues = "https://github.com/YaronKoresh/gesher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gesher"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]

# --- RUFF CONFIGURATION ---
[tool.ruff]
target-version = "py38"
line-length = 80

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
    "E402",
    "E722",
    "E741",
    "F401",
    "F403",
    "F821",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = [
    "E731",
]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- POE TASKS ---
[tool.poe.tasks]
# Project Development
dev = "python -m gesher server --secret dev-secret --port 8000"

# Quality Assurance
check = ["clean", "compile", "dead-code", "strip-comments", "pre-commit", "test", "clean"]
coverage = ["_coverage-clean", "_coverage-run", "_coverage-clean"]
test = ["test-py"]

[tool.poe.tasks.test-js]
cmd = "node --test tests/autobot_smart_link_unified.test.cjs tests/autobot_scripts.test.cjs tests/smart_link_scripts.test.cjs tests/deterministic_scenario_lanes.test.cjs tests/autobot_adversarial.test.cjs"

[tool.poe.tasks.autobot-preview]
cmd = "node scripts/print_autobot_regression_fixture.cjs"

[tool.poe.tasks.autobot-random]
cmd = "node scripts/run_autobot_scenario_lanes.cjs"

[tool.poe.tasks.test-py]
cmd = "python -m pytest tests/"

[tool.poe.tasks._coverage-run]
cmd = "python -m pytest -q --cov=src --cov-branch --cov-report=term-missing:skip-covered tests/"

[tool.poe.tasks._coverage-run.env]
COVERAGE_FILE = ".coverage.poe"

[tool.poe.tasks._coverage-clean]
cmd = "python -c \"from pathlib import Path; Path('.coverage.poe').unlink(missing_ok=True); Path('.coverage').unlink(missing_ok=True)\""

[tool.poe.tasks.compile]
cmd = "python -m compileall -q ."

[tool.poe.tasks.lint]
cmd = "python -m ruff check ."

[tool.poe.tasks.check-format]
cmd = "python -m ruff format --check ."

[tool.poe.tasks.pre-commit]
cmd = "python -m pre_commit run --all-files"

[tool.poe.tasks.pre-commit.env]
SKIP = "no-commit-to-branch"

[tool.poe.tasks.clean]
cmd = "python scripts/clean_workspace.py"

[tool.poe.tasks.strip-comments]
cmd = "python scripts/strip_comments.py"

[tool.poe.tasks.build]
cmd = "python -m build"

[tool.poe.tasks.build-wheel]
cmd = "python -m build --wheel"

[tool.poe.tasks.hook]
cmd = "python -m pre_commit install"

[tool.poe.tasks.format]
cmd = "python -m ruff format ."

[tool.poe.tasks.dead-code]
cmd = "python -m vulture src/ --min-confidence 80 --sort-by-size"
